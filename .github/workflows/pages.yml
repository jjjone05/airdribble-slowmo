name: Deploy airdribble slowmo to Pages

on:
  push:
    branches: ["main"]
  workflow_dispatch:
  schedule:
    - cron: "17 7 * * *"

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout deployment repo
        uses: actions/checkout@v4

      - name: Clone current upstream airdribble
        run: git clone --depth 1 https://github.com/manrajpannu/airdribble.git upstream

      - name: Record upstream revision
        run: git -C upstream rev-parse HEAD | tee UPSTREAM_COMMIT.txt

      - name: Apply slow-motion + Pages patch
        run: node scripts/patch-upstream.mjs upstream

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: upstream/package-lock.json

      - name: Install dependencies
        working-directory: upstream
        run: npm ci

      - name: Build static frontend
        working-directory: upstream
        env:
          GITHUB_PAGES: "true"
          NEXT_PUBLIC_BASE_PATH: "/airdribble-slowmo"
          NEXT_PUBLIC_API_URL: "https://airdribble.net"
        run: npm run build --workspace apps/web

      - name: Disable Jekyll
        run: touch upstream/apps/web/out/.nojekyll

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: upstream/apps/web/out

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deplloyment
        uses: actions/deploy-pages@v4
